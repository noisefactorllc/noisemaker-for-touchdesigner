name: Export kit

# Public repo: holds NO deploy credentials. Dispatches the export-kit
# release workflow, which builds this repo's export kit at this exact
# SHA and ships it to kits.noisedeck.app.
#
# Publication is manual or weekly, never on push, and the release dispatch
# needs a full rendered TouchDesigner parity run at the same SHA (GAP-013).
# The parity job runs on the self-hosted macOS GPU runner, which
# runs one job at a time. TouchDesigner has no headless mode: the runner's
# logged-in macOS session must be unlocked, and a locked or logged-out
# session blocks the render. Every TouchDesigner process the harness starts
# quits itself; the job sends no OS input.

on:
  workflow_dispatch:
  schedule:
    - cron: "47 9 * * 1"

permissions: {}

concurrency:
  group: export-kit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parity:
    if: github.ref == 'refs/heads/main'
    runs-on:
      group: noisemaker-gpu
      labels: [noisemaker-gpu]
    timeout-minutes: 90
    concurrency:
      group: noisemaker-for-touchdesigner-rendered-parity
      cancel-in-progress: false
    steps:
      - name: Require qualified M4 host and TouchDesigner
        run: |
          set -euo pipefail
          test "$(sysctl -n machdep.cpu.brand_string)" = 'Apple M4'
          test "$(sysctl -n hw.model)" = 'Mac16,12'
          test "$(defaults read /Applications/TouchDesigner.app/Contents/Info.plist CFBundleShortVersionString)" = '2025.32820'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Install parity dependencies
        run: |
          set -euo pipefail
          python311="$(realpath "$HOME/.local/bin/python3.11")"
          mkdir -p parity/.venv/lib64
          "$python311" -m venv --copies parity/.venv
          test -z "$(find parity/.venv -type l -print -quit)"
          parity/.venv/bin/python -m pip install -r requirements.txt

      - name: Check out the pinned reference
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^NM_REFERENCE_SHA_PINNED="\([0-9a-f]\{40\}\)"$/\1/p' scripts/test)"
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
          work="$(mktemp -d "$RUNNER_TEMP/touchdesigner-reference.XXXXXX")"
          reference="$work/source"
          objects="$work/objects.git"
          dependencies="$work/dependencies"
          mkdir "$reference" "$dependencies"
          git init --bare -q "$objects"
          git --git-dir="$objects" fetch -q --depth=1 https://github.com/noisefactorllc/noisemaker "$pin"
          parity/.venv/bin/python parity/reference_archive.py --materialize "$reference" "$objects" "$pin"
          cp "$reference/package.json" "$reference/package-lock.json" "$dependencies/"
          npm ci --prefix "$dependencies" --ignore-scripts --no-bin-links --no-audit --no-fund
          node "$dependencies/node_modules/playwright/cli.js" install chromium
          test -z "$(find "$reference" "$objects" "$dependencies" -type l -print -quit)"
          parity/.venv/bin/python parity/reference_archive.py "$reference" "$objects" "$pin"
          {
            echo "NM_REFERENCE_ROOT=$reference"
            echo "NM_REFERENCE_OBJECT_STORE=$objects"
            echo "NM_REFERENCE_DEPENDENCIES=$dependencies"
          } >> "$GITHUB_ENV"

      - name: Run full rendered parity
        run: NODE_OPTIONS="--import $GITHUB_WORKSPACE/tools/reference-dependencies.mjs" parity/.venv/bin/python scripts/parity-summary

  dispatch:
    needs: parity
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whether this SHA was released
        id: gate
        run: |
          set +e
          scripts/export-kit-gate
          rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Check the release dispatch configuration
        if: steps.gate.outputs.release == 'true'
        env:
          RELEASE_REPOSITORY: ${{ secrets.RELEASE_REPOSITORY }}
          EXPORT_KIT_RELEASE_WORKFLOW: ${{ secrets.EXPORT_KIT_RELEASE_WORKFLOW }}
        run: |
          missing=""
          [ -n "$RELEASE_REPOSITORY" ] || missing="$missing RELEASE_REPOSITORY"
          [ -n "$EXPORT_KIT_RELEASE_WORKFLOW" ] || missing="$missing EXPORT_KIT_RELEASE_WORKFLOW"
          if [ -n "$missing" ]; then
            echo "::error::The release dispatch is not configured. Empty or unset secret(s):$missing"
            exit 1
          fi

      - name: Mint release-dispatch token
        if: steps.gate.outputs.release == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liy6T6BW0BXuZRzx
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: ${{ secrets.RELEASE_REPOSITORY }}

      - name: Reserve this SHA before dispatch
        if: steps.gate.outputs.release == 'true'
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          scripts/export-kit-reserve
          rc=$?
          set -e
          case "$rc" in
            0) echo "release=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "release=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      - name: Dispatch the export-kit release
        if: steps.reserve.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_REPOSITORY: ${{ secrets.RELEASE_REPOSITORY }}
          EXPORT_KIT_RELEASE_WORKFLOW: ${{ secrets.EXPORT_KIT_RELEASE_WORKFLOW }}
        run: |
          gh workflow run "$EXPORT_KIT_RELEASE_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY_OWNER/$RELEASE_REPOSITORY" \
            --ref main \
            -f kit=touchdesigner \
            -f sha=${{ github.sha }}
